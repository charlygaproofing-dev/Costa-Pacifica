<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Costa Pacífica · CP1604</title>
<style>
:root{
  --teal:#0e7c7b; --teal-d:#0a5f5e; --sand:#f7f3ea; --ink:#1e2a32;
  --muted:#6b7d8a; --card:#ffffff; --line:#e5e0d3; --red:#c0392b; --green:#1e8e5a;
  --amber:#d48806;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--sand); color:var(--ink); font-size:15px;}
header.top{background:linear-gradient(135deg,var(--teal-d),var(--teal)); color:#fff;
  padding:14px 16px; position:sticky; top:0; z-index:10;}
header.top h1{margin:0; font-size:18px; letter-spacing:.3px;}
header.top .sub{font-size:12px; opacity:.85;}
.view{display:none; padding:14px 12px 90px; max-width:720px; margin:0 auto;}
.view.active{display:block;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.card{background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.card .val{font-size:22px; font-weight:700; margin-top:2px;}
.card .val.money{color:var(--teal-d);}
.card .val.neg{color:var(--red);}
.card.full{grid-column:1/-1;}
.list{background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.row-item{padding:11px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px;}
.row-item:last-child{border-bottom:none;}
.row-item .t{font-weight:600;}
.row-item .s{font-size:12px; color:var(--muted);}
.row-item .amt{font-weight:700; white-space:nowrap;}
.badge{font-size:11px; padding:2px 8px; border-radius:20px; background:#eef6f5; color:var(--teal-d); font-weight:600;}
.badge.warn{background:#fdf3e3; color:var(--amber);}
.badge.bad{background:#fdecea; color:var(--red);}
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
  display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom);}
nav.bottom button{flex:1; border:none; background:none; padding:9px 2px 7px; font-size:10px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;}
nav.bottom button .ic{font-size:19px;}

svg.ic{width:1.15em;height:1.15em;vertical-align:-0.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
svg.ic.fill{fill:currentColor;}
.nav-ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.dr-ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.drawer .di .ic{display:flex;align-items:center;}
nav.bottom button .ic{display:flex;align-items:center;justify-content:center;}
h2.st svg.ic{margin-right:6px;}
.btn svg.ic{margin-right:6px;}
.rec-link{color:var(--teal-d); font-weight:600; cursor:pointer; white-space:nowrap;}
.rec-link svg.ic{margin-right:2px;}
.receta-view{background:#f7faf9; border:1px solid var(--line); border-radius:12px; padding:16px; font-size:14.5px; line-height:1.9;}
.receta-view b{color:var(--teal-d);}
.receta-view .rv-ver{font-weight:700; margin:8px 0 2px; color:var(--ink);}
nav.bottom button.on{color:var(--teal-d); font-weight:700;}
.drawer-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none;}
.drawer-bg.open{display:block;}
.drawer{position:fixed; top:0; left:0; bottom:0; width:272px; background:#fff; z-index:41;
  transform:translateX(-105%); transition:transform .25s ease; display:flex; flex-direction:column;
  box-shadow:2px 0 12px rgba(0,0,0,.18);}
.drawer.open{transform:none;}
.drawer .dh{background:linear-gradient(135deg,var(--teal-d),var(--teal)); color:#fff; padding:20px 16px;}
.drawer .di{display:flex; gap:12px; align-items:center; padding:11px 16px; border-bottom:1px solid #f2f2f2; cursor:pointer;}
.drawer .di .ic{font-size:22px; min-width:28px; text-align:center;}
.drawer .di .t{font-weight:600; font-size:14px; color:var(--ink);}
.drawer .di .s{font-size:11px; color:var(--muted);}
.drawer .di.on{background:#eef6f6;}
.drawer .df{margin-top:auto; padding:14px 16px; font-size:10px; color:var(--muted); letter-spacing:1px; border-top:1px solid #f2f2f2;}
.fab{position:fixed; right:16px; bottom:78px; width:56px; height:56px; border-radius:50%;
  background:var(--teal); color:#fff; font-size:28px; border:none; box-shadow:0 3px 10px rgba(0,0,0,.25); cursor:pointer; z-index:9;}
form.sheet{background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
form.sheet label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.4px;}
form.sheet input, form.sheet select, form.sheet textarea{width:100%; padding:10px; font-size:15px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);}
form.sheet textarea{resize:vertical; min-height:60px;}
.btn{display:block; width:100%; padding:13px; border:none; border-radius:10px; font-size:16px; font-weight:700;
  background:var(--teal); color:#fff; cursor:pointer; margin-top:14px;}
.btn.sec{background:#eef0f2; color:var(--ink);}
.btn.danger{background:var(--red);}
h2.st{font-size:16px; margin:4px 0 10px;}
.toolbar{display:flex; gap:8px; margin-bottom:10px;}
.toolbar input{flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
.login-wrap{max-width:340px; margin:60px auto 0; padding:20px; text-align:center;}
.login-wrap .logo{font-size:44px;}
.login-logo{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#fff;
  box-shadow:0 6px 22px rgba(0,0,0,.14);display:block;margin:0 auto;}
.login-wrap h1{color:var(--teal-d); margin:8px 0 2px;}
.login-wrap p{color:var(--muted); font-size:13px;}
.login-wrap input{width:100%; padding:13px; font-size:18px; text-align:center; letter-spacing:6px;
  border:1px solid var(--line); border-radius:10px; margin:14px 0;}
.err{color:var(--red); font-size:13px; min-height:18px;}
.empty{padding:26px; text-align:center; color:var(--muted); font-size:14px;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:20;
  align-items:flex-end; justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff; width:100%; max-width:720px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:16px 16px 30px;}
.modal h3{margin:4px 0 6px;}
.x{float:right; border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer;}
table.rep{width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:12px; overflow:hidden;}
table.rep th{background:var(--teal-d); color:#fff; padding:8px 6px; text-align:left; font-size:11px; text-transform:uppercase;}
table.rep td{padding:8px 6px; border-bottom:1px solid var(--line);}
table.rep tr.tot td{font-weight:700; background:#eef6f5;}
</style>
</head>

<script>
/* ============ CONFIG — se llena al desplegar ============ */
var CFG = {
  url: "https://script.google.com/macros/s/AKfycbxs4W5eXxrFtCSi6TbcEUd6njo7tIkzz7bfiJtDCg1wGB0BQOouyeYLeuCXzVdbAMNc4w/exec",
  token: "BN67XF9BiQzejKyTq38kdwtLMmLWX7axv0CaChHEX9cYTA40"
};
</script>
<script>
/* ================= API ================= */
var SUC = 'CP1604';
async function api(action, params, isPost) {
  params = params || {};
  if (!isPost) {
    var q = new URLSearchParams(Object.assign({ action: action, token: CFG.token }, params));
    var r = await fetch(CFG.url + '?' + q.toString(), { cache: 'no-store' });
    return r.json();
  }
  var r2 = await fetch(CFG.url, { method: 'POST', cache: 'no-store',
    body: JSON.stringify(Object.assign({ action: action, token: CFG.token }, params)) });
  return r2.json();
}
function money(n){ n = parseFloat(n)||0; return '$' + n.toLocaleString('es-MX',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ================= LOGIN ================= */
var ME = null;
async function sha256hex(s){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function doLogin(){
  var u = document.getElementById('pinUser').value.trim().toLowerCase();
  var p = document.getElementById('pinCode').value.trim();
  var err = document.getElementById('loginErr');
  err.textContent = 'Verificando…';
  try {
    var d = await api('list', { tab: 'usuarios' });
    if (!d.ok) throw new Error(d.error || 'Error de conexión');
    var h = await sha256hex(p);
    var found = (d.rows||[]).find(function(r){
      return String(r.username||'').toLowerCase()===u && String(r.pinHash)===h && String(r.activo).toLowerCase()!=='no';
    });
    if (!found) { err.textContent = 'Usuario o PIN incorrecto'; return; }
    ME = found;
    document.getElementById('loginView').style.display='none';
    document.getElementById('appView').style.display='block';
    document.getElementById('hdrSub').textContent = 'CP1604 · ' + (ME.nombre||ME.username);
    go('dash');
  } catch(e){ err.textContent = 'Error: ' + e.message; }
}

/* ================= MENU LATERAL ================= */
var MODS = [
  ['dash','<svg class="dr-ic"><use href="#i-chart"/></svg>','Panel','Resumen del día'],
  ['ventas','<svg class="dr-ic"><use href="#i-cash"/></svg>','Ventas','Día, semana, mes y trimestre'],
  ['gastos','<svg class="dr-ic"><use href="#i-receipt"/></svg>','Gastos','Registro de gastos'],
  ['personal','<svg class="dr-ic"><use href="#i-users"/></svg>','Personal','Staff, training y evaluaciones'],
  ['nomina','<svg class="dr-ic"><use href="#i-wallet"/></svg>','Nómina','Pagos y tip-out'],
  ['inventario','<svg class="dr-ic"><use href="#i-box"/></svg>','Inventario','Existencias y orden de compra'],
  ['menu','<svg class="dr-ic"><use href="#i-utensils"/></svg>','Menú','Platillos y recetario'],
  ['prov','<svg class="dr-ic"><use href="#i-truck"/></svg>','Proveedores','Catálogo de proveedores'],
  ['act','<svg class="dr-ic"><use href="#i-cal"/></svg>','Actividades','Calendario 2026'],
  ['checks','<svg class="dr-ic"><use href="#i-checksq"/></svg>','Checks','Checklists FOH / BOH']
];
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', !!open);
  document.getElementById('drawerBg').classList.toggle('open', !!open);
  if (open) paintDrawer();
}
function paintDrawer(){
  document.getElementById('drawerItems').innerHTML = MODS.map(function(m){
    return '<div class="di'+(CUR===m[0]?' on':'')+'" onclick="toggleDrawer(false);go(\''+m[0]+'\')">'
      +'<div class="ic">'+m[1]+'</div><div><div class="t">'+m[2]+'</div><div class="s">'+m[3]+'</div></div></div>';
  }).join('');
}

/* ================= NAV ================= */
var CUR = 'dash';
function go(v){
  CUR = v;
  document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('active'); });
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('#bottomNav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
  document.getElementById('fabBtn').style.display = (v==='dash') ? 'none' : 'block';
  RENDER[v]();
}
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

/* ================= RECETA VIEW ================= */
async function viewReceta(id){
  var rows = await getRows('menu');
  var r = rows.find(function(x){ return String(x.id)===String(id); }) || {};
  var body = esc(r.receta||'')
    .replace(/Versión (\d+):/g, '<div class="rv-ver">Versión $1</div>')
    .replace(/(Garnish|Glass|Rim):/g, '<b>$1:</b>')
    .replace(/\n/g, '<br>');
  openModal('<h3><svg class="ic"><use href="#i-wine"/></svg> '+esc(r.platillo||'Receta')+'</h3>' +
    '<div class="receta-view">'+body+'</div>' +
    '<button class="btn sec" style="margin-top:12px" onclick="closeModal()">Cerrar</button>');
}

/* ================= DASHBOARD ================= */
function dStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function vTotal(r){ return (parseFloat(r.total)||0) || ((parseFloat(r.comedor)||0)+(parseFloat(r.paraLlevar)||0)+(parseFloat(r.delivery)||0)) || ((parseFloat(r.ventaComida)||0)+(parseFloat(r.ventaLicor)||0)); }
function sum(a){ return a.reduce(function(x,y){ return x+(parseFloat(y)||0); },0); }
function pct(n){ return (parseFloat(n)||0).toFixed(1)+'%'; }
async function rDash(){
  var el = document.getElementById('v-dash');
  el.innerHTML = '<div class="empty">Cargando…</div>';
  try {
    var res = await Promise.all([
      api('dashboard', {}),
      api('list', { tab: 'ventas' }),
      api('list', { tab: 'gastos' }),
      api('list', { tab: 'nomina' })
    ]);
    var b = res[0].dashboard, ventas = res[1].rows||[], gastos = res[2].rows||[], nom = res[3].rows||[];
    var now = new Date(), hoy = dStr(now);
    var ayer = dStr(new Date(now.getTime()-864e5));
    var vHoy = 0, vAyer = 0;
    var last7 = [];
    for (var i=6;i>=0;i--){ var dt = new Date(now.getTime()-i*864e5); last7.push({ f: dStr(dt), dw: 'D L M M J V S'[dt.getDay()*2]||'', v: 0 }); }
    ventas.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10), t = vTotal(r);
      if (f===hoy) vHoy += t;
      if (f===ayer) vAyer += t;
      for (var i=0;i<7;i++) if (last7[i].f===f) last7[i].v += t;
    });
    var chg = vAyer>0 ? Math.round((vHoy-vAyer)/vAyer*100) : (vHoy>0?100:0);
    var chgHtml = vHoy===0&&vAyer===0 ? '' : '<div style="font-size:12px;color:'+(chg>=0?'var(--green)':'var(--red)')+'">'+(chg>=0?'▲':'▼')+' '+Math.abs(chg)+'% vs ayer</div>';
    var maxV = Math.max.apply(null, last7.map(function(x){return x.v;}).concat([1]));
    var bars = last7.map(function(x){
      var h = Math.max(4, Math.round(x.v/maxV*64));
      var wd = x.f.substring(5).replace('-','/');
      return '<div style="flex:1;text-align:center"><div style="height:70px;display:flex;align-items:flex-end;justify-content:center"><div style="width:70%;height:'+h+'px;background:'+(x.f===hoy?'var(--teal)':'#bcd9d8')+';border-radius:4px 4px 0 0"></div></div><div style="font-size:10px;color:var(--muted)">'+x.dw+'<br>'+wd+'</div></div>';
    }).join('');
    var w0 = dStr(new Date(now.getTime()-6*864e5));
    var gCat = {}, gTot = 0;
    gastos.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10);
      if (f>=w0){ var c=r.categoria||'Otros', m=parseFloat(r.monto)||0; gCat[c]=(gCat[c]||0)+m; gTot+=m; }
    });
    var gTop = Object.keys(gCat).sort(function(a,b2){return gCat[b2]-gCat[a];}).slice(0,5);
    var gHtml = gTop.map(function(c){
      var pct = gTot>0?Math.round(gCat[c]/gTot*100):0;
      return '<div class="row-item"><div><div class="t">'+esc(c)+'</div><div style="height:6px;background:#eee;border-radius:3px;margin-top:4px;width:140px"><div style="height:6px;width:'+pct+'%;background:var(--teal);border-radius:3px"></div></div></div><div class="amt">'+money(gCat[c])+'</div></div>';
    }).join('') || '<div class="empty">Sin gastos esta semana</div>';
    var nPend = nom.filter(function(r){ var p=String(r.pagado||'').toLowerCase(); return p!=='sí'&&p!=='si'; });
    var nTot = nPend.reduce(function(a,r){return a+(parseFloat(r.neto)||0);},0);
    var inv = (b.inventarioBajo||[]).map(function(r){
      return '<div class="row-item"><div><div class="t">'+esc(r.producto)+'</div><div class="s">Mínimo: '+esc(r.minimo)+'</div></div><span class="badge bad">'+esc(r.existencia)+'</span></div>';
    }).join('') || '<div class="empty">Todo en niveles normales</div>';
    var mon = mondayOf(hoy);
    var sun = dStr(new Date(new Date(mon+'T12:00:00').getTime()+6*864e5));
    var hrs = {};
    nom.forEach(function(r){
      var f = String(r.periodoInicio||'').substring(0,10);
      if (f>=mon && f<=sun){ var id=r.personalId||'?'; hrs[id]=(hrs[id]||0)+(parseFloat(r.horas)||0); }
    });
    var hAlert = Object.keys(hrs).filter(function(id){ return hrs[id]>=35; })
      .sort(function(a,b){return hrs[b]-hrs[a];})
      .map(function(id){
        var h = Math.round(hrs[id]*10)/10;
        var over = h>=40;
        return '<div class="row-item"><div><div class="t">'+esc(id)+'</div><div class="s">'+(over?'Pasó las 40h':'Cuidado con las horas')+' · cuidar el costo</div></div><span class="badge '+(over?'bad':'warn')+'">'+h+'h</span></div>';
      }).join('') || '<div class="empty">Nadie cerca de las 40h esta semana</div>';

    el.innerHTML =
      '<h2 class="st">Hoy · ' + esc(b.fecha) + '</h2>' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">Ventas hoy</div><div class="val money">'+money(vHoy)+'</div>'+chgHtml+'</div>' +
        '<div class="card"><div class="lbl">Utilidad 7 días</div><div class="val '+(b.utilidadSemana<0?'neg':'money')+'">'+money(b.utilidadSemana)+'</div><div style="font-size:12px;color:var(--muted)">Ventas '+money(b.ventasSemana)+'</div></div>' +
      '</div>' +
      '<h2 class="st">Ventas · últimos 7 días</h2><div class="card" style="margin-bottom:14px"><div style="display:flex;gap:4px">'+bars+'</div></div>' +
      '<h2 class="st">Gastos por categoría · 7 días ('+money(gTot)+')</h2><div class="list" style="margin-bottom:14px">'+gHtml+'</div>' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">Nómina pendiente</div><div class="val '+(nPend.length?'neg':'money')+'">'+money(nTot)+'</div><div style="font-size:12px;color:var(--muted)">'+nPend.length+' pago(s)</div></div>' +
        '<div class="card"><div class="lbl">Inventario bajo</div><div class="val '+(b.inventarioBajo.length?'neg':'money')+'">'+b.inventarioBajo.length+'</div><div style="font-size:12px;color:var(--muted)">productos</div></div>' +
      '</div>' +
      '<h2 class="st"><svg class="ic"><use href="#i-alert"/></svg> Horas esta semana · cuidar el costo</h2><div class="list" style="margin-bottom:14px">'+hAlert+'</div>' +
      '<h2 class="st"><svg class="ic"><use href="#i-alert"/></svg> Inventario bajo</h2><div class="list">'+inv+'</div>';
  } catch(e){ el.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}

var CACHE = {};
async function getRows(tab){
  if (CACHE[tab]) return CACHE[tab];
  var d = await api('list', { tab: tab });
  if (!d.ok) throw new Error(d.error);
  var rows = (d.rows||[]).filter(function(r){ return String(r.sucursal||SUC)===SUC || !r.sucursal; });
  rows.sort(function(a,b){ return String(b._row)-String(a._row); });
  CACHE[tab] = rows;
  return rows;
}

function mondayOf(d){ var x=new Date(d); var day=(x.getDay()+6)%7; x.setHours(12,0,0,0); x.setDate(x.getDate()-day); return dStr(x); }

/* Metas del formato OP-ADMIN COSTA 1604: semana $54,000 (lun 4,000, mar 4,000, mié 5,000, jue 8,000, vie 13,000, sáb 13,500, dom 6,500) */
var META_DIA = [6500,4000,4000,5000,8000,13000,13500];
function metaDia(f){ var d=new Date(f+'T12:00:00'); return isNaN(d)?0:(META_DIA[d.getDay()]||0); }
function metaRango(a,b){ var t=0, d=new Date(a+'T12:00:00'), e=new Date(b+'T12:00:00'); while(d<=e){ t+=metaDia(dStr(d)); d.setDate(d.getDate()+1); } return t; }
function hasVal(r,k){ var v=r[k]; return v!==''&&v!==null&&v!==undefined; }
function sumK(rows,k){ var t=0,n=0; rows.forEach(function(r){ if(hasVal(r,k)){ t+=parseFloat(r[k])||0; n++; } }); return {t:t,n:n}; }
function gcat(g,c){ var t=0,n=0; g.forEach(function(r){ if((r.categoria||'')===c){ t+=parseFloat(r.monto)||0; n++; } }); return {t:t,n:n}; }
function aggRango(v,g,a,b){
  var vv=v.filter(function(r){ var f=String(r.fecha||'').substring(0,10); return f>=a&&f<=b; });
  var gg=g.filter(function(r){ var f=String(r.fecha||'').substring(0,10); return f>=a&&f<=b; });
  var ag={n:vv.length};
  var net=0; vv.forEach(function(r){ net+=vTotal(r); }); ag.net={t:net,n:vv.length};
  ag.vC=sumK(vv,'ventaComida'); ag.vL=sumK(vv,'ventaLicor');
  ag.inv=sumK(vv,'invitados');
  ag.prop=sumK(vv,'propinas'); ag.imp=sumK(vv,'impuestos'); ag.grat=sumK(vv,'gratificacion');
  ag.desc=sumK(vv,'descuentos'); ag.voids=sumK(vv,'voids');
  ag.efec=sumK(vv,'efectivo'); ag.tarj=sumK(vv,'tarjeta');
  ag.des=sumK(vv,'desayuno'); ag.com=sumK(vv,'comida'); ag.cen=sumK(vv,'cena'); ag.noc=sumK(vv,'noche');
  ag.gMC=gcat(gg,'Mercancía Comida'); ag.gML=gcat(gg,'Mercancía Licor');
  var foh=gcat(gg,'Desechables'), limp=gcat(gg,'Limpieza');
  ag.gFOH={t:foh.t+limp.t,n:foh.n+limp.n};
  ag.gRenta=gcat(gg,'Renta');
  var ot={t:0,n:0}; ['Servicios','Equipo','Marketing','Música y Entretenimiento','Reparaciones','Otros'].forEach(function(c){ var s=gcat(gg,c); ot.t+=s.t; ot.n+=s.n; });
  ag.gOtros=ot;
  var gt={t:0,n:0}; gg.forEach(function(r){ if((r.categoria||'')!=='Nómina'){ gt.t+=parseFloat(r.monto)||0; gt.n++; } });
  ag.gTot=gt;
  ag.notas=vv.map(function(r){ return r.notas; }).filter(function(x){ return x; }).join(' · ');
  return ag;
}
function laborRango(n,a,b){ var t=0,c=0; n.forEach(function(r){ var f=String(r.periodoFin||'').substring(0,10); if(f>=a&&f<=b){ t+=parseFloat(r.neto)||0; c++; } }); return c>0?t:null; }
function deriv(ag,labor){
  var d={};
  d.totalAmt=(ag.net.n||ag.grat.n||ag.imp.n||ag.prop.n)?ag.net.t+ag.grat.t+ag.imp.t+ag.prop.t:null;
  d.cobrado=(ag.efec.n||ag.tarj.n)?ag.efec.t+ag.tarj.t:null;
  d.ppa=ag.inv.t>0?ag.net.t/ag.inv.t:null;
  d.mealTot=(ag.des.n||ag.com.n||ag.cen.n||ag.noc.n)?ag.des.t+ag.com.t+ag.cen.t+ag.noc.t:null;
  d.cogs=(ag.gMC.n||ag.gML.n)?ag.gMC.t+ag.gML.t:null;
  d.foodPct=(ag.gMC.n&&ag.vC.t>0)?ag.gMC.t/ag.vC.t*100:null;
  d.liqPct=(ag.gML.n&&ag.vL.t>0)?ag.gML.t/ag.vL.t*100:null;
  d.labPct=(labor!==null&&ag.net.t>0)?labor/ag.net.t*100:null;
  d.prime=(d.cogs!==null&&labor!==null&&ag.net.t>0)?(d.cogs+labor)/ag.net.t*100:null;
  d.util=(ag.net.n||ag.gTot.n)?ag.net.t-ag.gTot.t-(labor||0):null;
  return d;
}

    var ra=dStr(s)<a?a:dStr(s), rb=dStr(e)>b?b:dStr(e);
    return {h:'Sem '+ra.substring(5), ag:aggRango(v,g,ra,rb), labor:laborRango(n,ra,rb), meta:metaRango(ra,rb)};
  });
  cols.push({h:'TOTAL MES', ag:aggRango(v,g,a,b), labor:laborRango(n,a,b), meta:metaRango(a,b)});
  var h='<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'
    +'<button class="btn sec" style="margin:0;padding:6px 12px" onclick="mesNav(-1)">‹</button>'
    +'<b>'+MNAMES[m+1]+' '+y+'</b>'
    +'<button class="btn sec" style="margin:0;padding:6px 12px" onclick="mesNav(1)">›</button></div>';
  h+=formatoTable(cols);
  h+='<p style="color:#888;font-size:12px">Cada columna es una semana (lun–dom) dentro del mes. Labor = nómina con periodoFin en el rango.</p>';
  return h;
}
/* ============ CONTROL DEL TRIMESTRE ============ */
var TRIM = (function(){ var d=new Date(); return {q:Math.floor(d.getMonth()/3)+1, y:d.getFullYear()}; })();
function trimNav(d){ TRIM.q+=d; if(TRIM.q<1){TRIM.q=4;TRIM.y--;} if(TRIM.q>4){TRIM.q=1;TRIM.y++;} renderVentas(); }
function trimHtml(v,g,n){
  var months=[(TRIM.q-1)*3,(TRIM.q-1)*3+1,(TRIM.q-1)*3+2];
  var mn=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  function mRange(mi){ var a=TRIM.y+'-'+String(mi+1).padStart(2,'0')+'-01'; var b=TRIM.y+'-'+String(mi+1).padStart(2,'0')+'-'+new Date(TRIM.y,mi+1,0).getDate(); return [a,b]; }
  var cols=months.map(function(mi){ var r=mRange(mi); return {h:mn[mi], ag:aggRango(v,g,r[0],r[1]), labor:laborRango(n,r[0],r[1]), meta:metaRango(r[0],r[1])}; });
  var q0=mRange(months[0])[0], q1=mRange(months[2])[1];
  cols.push({h:'TRIM', ag:aggRango(v,g,q0,q1), labor:laborRango(n,q0,q1), meta:metaRango(q0,q1)});
  var h='<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">'
    +'<button class="btn sec" style="margin:0;padding:6px 12px" onclick="trimNav(-1)">‹</button>'
    +'<b>Q'+TRIM.q+' '+TRIM.y+'</b>'
    +'<button class="btn sec" style="margin:0;padding:6px 12px" onclick="trimNav(1)">›</button></div>';
  h+=formatoTable(cols);
  h+='<p style="color:#888;font-size:12px">Meta mensual = suma de las metas diarias del formato ($54,000/semana). Utilidad = ventas netas − gastos − nómina.</p>';
  return h;
}
async function renderVentas(){
  var el = document.getElementById('v-ventas');
  el.innerHTML = '<h2 class="st">Ventas · Formato OP-ADMIN</h2>'+ventasToggle()+'<div id="ventas-body"><div class="empty">Cargando…</div></div>';
  try {
    var v = await getRows('ventas'), g = await getRows('gastos'), n = await getRows('nomina');
    if(!DIA_INIT){
      DIA_INIT=true;
      var maxf='';
      v.forEach(function(r){ var f=String(r.fecha||'').substring(0,10); if(f.length===10&&f>maxf) maxf=f; });
      if(maxf){ DIA_SEL=maxf; SEMANA_SEL=mondayOf(maxf); MES_SEL=maxf.substring(0,7); }
      else { SEMANA_SEL=mondayOf(todayStr()); }
    }
    if(!SEMANA_SEL) SEMANA_SEL=mondayOf(DIA_SEL);
    var body = document.getElementById('ventas-body');
    if (VENTAS_VISTA==='dia') body.innerHTML = diaHtml(v,g);
    else if (VENTAS_VISTA==='semana') body.innerHTML = semanaHtml(v,g,n);
    else if (VENTAS_VISTA==='mes') body.innerHTML = mesHtml(v,g,n);
    else body.innerHTML = trimHtml(v,g,n);
  } catch(e){ document.getElementById('ventas-body').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
RENDER['ventas'] = renderVentas;

/* ============ CALENDARIO DE ACTIVIDADES ============ */
function renderAct(){
  var el = document.getElementById('v-act');
  el.innerHTML = '<h2 class="st">Actividades 2026 · CP1604</h2><div class="empty">Cargando…</div>';
  getRows('actividades').then(function(rows){
    var mo = {};
    rows.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10); if (f.length<7) return;
      (mo[f.substring(0,7)]=mo[f.substring(0,7)]||[]).push(r);
    });
    var keys = Object.keys(mo).sort();
    if (!keys.length){ el.innerHTML = '<h2 class="st">Actividades</h2><div class="empty">Sin actividades.</div>'; return; }
    var html = '<h2 class="st">Actividades 2026 · CP1604</h2>';
    keys.forEach(function(k){
      var y = k.substring(0,4), m = parseInt(k.substring(5,7),10);
      var items = mo[k].sort(function(a,b){ return String(a.fecha)<String(b.fecha)?-1:1; }).map(function(r){
        var f = String(r.fecha).substring(0,10);
        var dw = DNAMES[new Date(f+'T12:00:00').getDay()];
        var sub = esc(r.detalle||'') + (r.meta?' · <svg class="ic"><use href="#i-target"/></svg> '+esc(r.meta):'') + (r.marketing?'<br><svg class="ic"><use href="#i-mega"/></svg> '+esc(r.marketing):'') + (r.notas?'<br><svg class="ic"><use href="#i-note"/></svg> '+esc(r.notas):'');
        return '<div class="row-item"><div><div class="t">'+dw+' '+f.substring(8,10)+' · '+esc(r.actividad||'')+'</div><div class="s">'+sub+'</div></div>'
          +'<div><button class="btn sm sec" style="margin:0" onclick="openForm(\'act\',\''+esc(String(r.id||''))+'\')"><svg class="ic"><use href="#i-pencil"/></svg></button></div></div>';
      }).join('');
      html += '<h2 class="st" style="margin-top:14px">'+MNAMES[m]+' '+y+'</h2><div class="list">'+items+'</div>';
    });
    el.innerHTML = html;
  }).catch(function(e){ el.innerHTML = '<h2 class="st">Actividades</h2><div class="empty">Error: '+esc(e.message)+'</div>'; });
}
RENDER['act'] = renderAct;

/* ============ CHECKLISTS FOH / BOH ============ */
var CHK_AREA = 'FOH', CHK_MOM = 'Apertura', CHK_RESP = '';
function setChk(a,m){ if(a) CHK_AREA=a; if(m) CHK_MOM=m; renderChecks(); }
async function renderChecks(){
  var el = document.getElementById('v-checks');
  var hoy = todayStr();
  el.innerHTML = '<h2 class="st">Checklists · '+hoy+'</h2>'
    +'<div style="display:flex;gap:8px;margin-bottom:10px">'
    +[['FOH','<svg class="ic"><use href="#i-utensils"/></svg> FOH'],['BOH','<svg class="ic"><use href="#i-flame"/></svg> BOH']].map(function(v){ return '<button class="btn '+(CHK_AREA===v[0]?'':'sec')+'" style="margin:0;padding:9px;flex:1" onclick="setChk(\''+v[0]+'\')">'+v[1]+'</button>'; }).join('')+'</div>'
    +'<div style="display:flex;gap:8px;margin-bottom:10px">'
    +[['Apertura','<svg class="ic"><use href="#i-sunrise"/></svg> Apertura'],['Cierre','<svg class="ic"><use href="#i-moon"/></svg> Cierre']].map(function(v){ return '<button class="btn '+(CHK_MOM===v[0]?'':'sec')+'" style="margin:0;padding:9px;flex:1" onclick="setChk(null,\''+v[0]+'\')">'+v[1]+'</button>'; }).join('')+'</div>'
    +'<label>Responsable</label><input id="chkResp" style="width:100%;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px" value="'+esc(CHK_RESP)+'" oninput="CHK_RESP=this.value" placeholder="Nombre del responsable">'
    +'<div class="list" id="chkList"><div class="empty">Cargando…</div></div>'
    +'<div style="margin-top:10px"><button class="btn sec" style="margin:0" onclick="openForm(\'checklists\')">+ Editar tareas</button></div>';
  try {
    var mc = await api('list',{tab:'checklists'});
    var lg = await api('list',{tab:'checklist_log'});
    var tasks = (mc.rows||[]).filter(function(r){ return r.area===CHK_AREA && r.momento===CHK_MOM && String(r.activo).toLowerCase()!=='no'; })
      .sort(function(a,b){ return (parseFloat(a.orden)||0)-(parseFloat(b.orden)||0); });
    var logs = {};
    (lg.rows||[]).forEach(function(r){ if(String(r.fecha).substring(0,10)===hoy) logs[r.checklistId]=r; });
    var done = tasks.filter(function(t){ var l=logs[t.id]; return l && String(l.hecho).toLowerCase()==='sí'; }).length;
    document.getElementById('chkList').innerHTML =
      (tasks.length?'<div class="card" style="margin-bottom:8px"><div class="lbl">Avance</div><div class="val">'+done+' / '+tasks.length+'</div></div>':'')
      + tasks.map(function(t){
        var l = logs[t.id], on = l && String(l.hecho).toLowerCase()==='sí';
        return '<div class="row-item" onclick="chkToggle(\''+esc(t.id)+'\','+(on?'false':'true')+')">'
          +'<div style="font-size:22px;min-width:30px">'+(on?'<svg class="ic"><use href="#i-checksq"/></svg>':'<svg class="ic"><use href="#i-square"/></svg>')+'</div>'
          +'<div><div class="t" style="'+(on?'text-decoration:line-through;color:var(--muted)':'')+'">'+esc(t.tarea)+'</div>'
          +(l&&l.responsable?'<div class="s">'+esc(l.responsable)+'</div>':'')+'</div></div>';
      }).join('') || '<div class="empty">Sin tareas.</div>';
  } catch(e){ document.getElementById('chkList').innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
async function chkToggle(chkId, val){
  var hoy = todayStr();
  try {
    var lg = await api('list',{tab:'checklist_log'});
    var ex = (lg.rows||[]).find(function(r){ return String(r.fecha).substring(0,10)===hoy && String(r.checklistId)===String(chkId); });
    if (ex) await api('update',{tab:'checklist_log', id:ex.id, fields:{hecho: val?'Sí':'No', responsable: CHK_RESP}}, true);
    else await api('create',{tab:'checklist_log', record:{fecha:hoy, area:CHK_AREA, momento:CHK_MOM, checklistId:chkId, hecho: val?'Sí':'No', responsable: CHK_RESP}}, true);
    renderChecks();
  } catch(e){ alert('Error: '+e.message); }
}
RENDER['checks'] = renderChecks;

/* ================= FORM ================= */
function fldHtml(f, val){
  val = val==null?'':val;
  var req = f.req ? 'required' : '';
  if (f.t==='select') {
    return '<label>'+f.l+'</label><select id="f_'+f.k+'" '+req+'><option value="">—</option>' +
      f.opts.map(function(o){ return '<option value="'+esc(o)+'"'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select>';
  }
  if (f.t==='textarea' || f.k==='notas') return '<label>'+f.l+'</label><textarea id="f_'+f.k+'">'+esc(val)+'</textarea>';
  var type = f.t==='number' ? 'number' : (f.t==='date' ? 'date' : 'text');
  var step = f.t==='number' ? 'step="0.01"' : '';
  return '<label>'+f.l+'</label><input id="f_'+f.k+'" type="'+type+'" '+step+' value="'+esc(val)+'" '+req+'>';
}
async function openForm(key, id, fechaPreset){
  key = key || CUR; if (key==='dash') return;
  var def = TABDEF[key];
  var rec = {};
  if (id) {
    var rows = await getRows(def.tab);
    rec = rows.find(function(r){ return String(r.id)===String(id); }) || {};
  } else {
    if (def.fields.some(function(f){return f.k==='fecha';})) rec.fecha = fechaPreset || todayStr();
    if (def.fields.some(function(f){return f.k==='activo';})) rec.activo = 'Sí';
    if (def.fields.some(function(f){return f.k==='pagado';})) rec.pagado = 'No';
    if (def.fields.some(function(f){return f.k==='tipo';})) rec.tipo = (MENU_FILT==='Comida'||MENU_FILT==='Barra') ? MENU_FILT : 'Comida';
  }
  var html = '<h3>'+(id?'Editar':'Nuevo')+' '+def.singular+'</h3><form class="sheet" onsubmit="return saveForm(event,\''+key+'\',\''+esc(id||'')+'\')">' +
    def.fields.map(function(f){ return fldHtml(f, rec[f.k]); }).join('') +
    '<button class="btn" type="submit">Guardar</button>' +
    (id ? '<button class="btn danger" type="button" onclick="delRec(\''+key+'\',\''+esc(id)+'\')">Eliminar</button>' : '') +
    '</form>';
  openModal(html);
}
async function saveForm(ev, key, id){
  ev.preventDefault();
  var def = TABDEF[key];
  var rec = { sucursal: SUC };
  def.fields.forEach(function(f){
    var el = document.getElementById('f_'+f.k);
    rec[f.k] = el ? el.value.trim() : '';
  });
  if (key==='ventas' && !rec.total) {
    var ch=(parseFloat(rec.comedor)||0)+(parseFloat(rec.paraLlevar)||0)+(parseFloat(rec.delivery)||0);
    var fl=(parseFloat(rec.ventaComida)||0)+(parseFloat(rec.ventaLicor)||0);
    var mp=(parseFloat(rec.desayuno)||0)+(parseFloat(rec.comida)||0)+(parseFloat(rec.cena)||0)+(parseFloat(rec.noche)||0);
    rec.total = ch>0?ch:(fl>0?fl:mp);
  }
  if (key==='nomina') {
    var vb = parseFloat(rec.ventasBrutas)||0, pd = parseFloat(rec.propinasDeclaradas)||0;
    if (vb>0 && pd>0) rec.propinas = Math.round((pd - vb*0.04)*100)/100;
  }
  if (key==='evaluaciones') {
    var sc = ['actitud','conocimiento','ejecucion','equipo','comunicacion'].map(function(k){ return parseFloat(rec[k])||0; }).filter(function(x){ return x>0; });
    if (sc.length) rec.promedio = Math.round(sc.reduce(function(a,b){return a+b;},0)/sc.length*10)/10;
  }
  try {
    var d = id ? await api('update', { tab:def.tab, id:id, fields:rec }, true)
               : await api('create', { tab:def.tab, record:rec }, true);
    if (!d.ok) throw new Error(d.error);
    delete CACHE[def.tab];
    closeModal();
    if (['personal','training','training_progreso','evaluaciones','puestos'].indexOf(key)>=0) renderPersonal(); else if (key==='checklists') renderChecks(); else if (key==='ventas') renderVentas(); else renderList(key);
  } catch(e){ alert('Error: '+e.message); }
  return false;
}
async function delRec(key, id){
  if (!confirm('¿Eliminar este registro?')) return;
  var def = TABDEF[key];
  try {
    var d = await api('delete', { tab:def.tab, id:id }, true);
    if (!d.ok) throw new Error(d.error);
    delete CACHE[def.tab];
    closeModal();
    if (['personal','training','training_progreso','evaluaciones','puestos'].indexOf(key)>=0) renderPersonal(); else if (key==='checklists') renderChecks(); else if (key==='ventas') renderVentas(); else renderList(key);
  } catch(e){ alert('Error: '+e.message); }
}
</script>
