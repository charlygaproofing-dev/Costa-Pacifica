<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Costa Pacífica · CP1604</title>
<style>
:root{
  --teal:#0e7c7b; --teal-d:#0a5f5e; --sand:#f7f3ea; --ink:#1e2a32;
  --muted:#6b7d8a; --card:#ffffff; --line:#e5e0d3; --red:#c0392b; --green:#1e8e5a;
  --amber:#d48806;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--sand); color:var(--ink); font-size:15px;}
header.top{background:linear-gradient(135deg,var(--teal-d),var(--teal)); color:#fff;
  padding:14px 16px; position:sticky; top:0; z-index:10;}
header.top h1{margin:0; font-size:18px; letter-spacing:.3px;}
header.top .sub{font-size:12px; opacity:.85;}
.view{display:none; padding:14px 12px 90px; max-width:720px; margin:0 auto;}
.view.active{display:block;}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.card{background:var(--card); border-radius:12px; padding:12px; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.card .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
.card .val{font-size:22px; font-weight:700; margin-top:2px;}
.card .val.money{color:var(--teal-d);}
.card .val.neg{color:var(--red);}
.card.full{grid-column:1/-1;}
.list{background:var(--card); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08);}
.row-item{padding:11px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px;}
.row-item:last-child{border-bottom:none;}
.row-item .t{font-weight:600;}
.row-item .s{font-size:12px; color:var(--muted);}
.row-item .amt{font-weight:700; white-space:nowrap;}
.badge{font-size:11px; padding:2px 8px; border-radius:20px; background:#eef6f5; color:var(--teal-d); font-weight:600;}
.badge.warn{background:#fdf3e3; color:var(--amber);}
.badge.bad{background:#fdecea; color:var(--red);}
nav.bottom{position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--line);
  display:flex; z-index:10; padding-bottom:env(safe-area-inset-bottom);}
nav.bottom button{flex:1; border:none; background:none; padding:9px 2px 7px; font-size:10px; color:var(--muted);
  display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;}
nav.bottom button .ic{font-size:19px;}

svg.ic{width:1.15em;height:1.15em;vertical-align:-0.2em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
svg.ic.fill{fill:currentColor;}
.nav-ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.dr-ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.drawer .di .ic{display:flex;align-items:center;}
nav.bottom button .ic{display:flex;align-items:center;justify-content:center;}
h2.st svg.ic{margin-right:6px;}
.btn svg.ic{margin-right:6px;}
.rec-link{color:var(--teal-d); font-weight:600; cursor:pointer; white-space:nowrap;}
.rec-link svg.ic{margin-right:2px;}
.receta-view{background:#f7faf9; border:1px solid var(--line); border-radius:12px; padding:16px; font-size:14.5px; line-height:1.9;}
.receta-view b{color:var(--teal-d);}
.receta-view .rv-ver{font-weight:700; margin:8px 0 2px; color:var(--ink);}
nav.bottom button.on{color:var(--teal-d); font-weight:700;}
.drawer-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40; display:none;}
.drawer-bg.open{display:block;}
.drawer{position:fixed; top:0; left:0; bottom:0; width:272px; background:#fff; z-index:41;
  transform:translateX(-105%); transition:transform .25s ease; display:flex; flex-direction:column;
  box-shadow:2px 0 12px rgba(0,0,0,.18);}
.drawer.open{transform:none;}
.drawer .dh{background:linear-gradient(135deg,var(--teal-d),var(--teal)); color:#fff; padding:20px 16px;}
.drawer .di{display:flex; gap:12px; align-items:center; padding:11px 16px; border-bottom:1px solid #f2f2f2; cursor:pointer;}
.drawer .di .ic{font-size:22px; min-width:28px; text-align:center;}
.drawer .di .t{font-weight:600; font-size:14px; color:var(--ink);}
.drawer .di .s{font-size:11px; color:var(--muted);}
.drawer .di.on{background:#eef6f6;}
.drawer .df{margin-top:auto; padding:14px 16px; font-size:10px; color:var(--muted); letter-spacing:1px; border-top:1px solid #f2f2f2;}
.fab{position:fixed; right:16px; bottom:78px; width:56px; height:56px; border-radius:50%;
  background:var(--teal); color:#fff; font-size:28px; border:none; box-shadow:0 3px 10px rgba(0,0,0,.25); cursor:pointer; z-index:9;}
form.sheet{background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.1);}
form.sheet label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; text-transform:uppercase; letter-spacing:.4px;}
form.sheet input, form.sheet select, form.sheet textarea{width:100%; padding:10px; font-size:15px;
  border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink);}
form.sheet textarea{resize:vertical; min-height:60px;}
.btn{display:block; width:100%; padding:13px; border:none; border-radius:10px; font-size:16px; font-weight:700;
  background:var(--teal); color:#fff; cursor:pointer; margin-top:14px;}
.btn.sec{background:#eef0f2; color:var(--ink);}
.btn.danger{background:var(--red);}
h2.st{font-size:16px; margin:4px 0 10px;}
.toolbar{display:flex; gap:8px; margin-bottom:10px;}
.toolbar input{flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; font-size:14px;}
.login-wrap{max-width:340px; margin:60px auto 0; padding:20px; text-align:center;}
.login-wrap .logo{font-size:44px;}
.login-logo{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#fff;
  box-shadow:0 6px 22px rgba(0,0,0,.14);display:block;margin:0 auto;}
.login-wrap h1{color:var(--teal-d); margin:8px 0 2px;}
.login-wrap p{color:var(--muted); font-size:13px;}
.login-wrap input{width:100%; padding:13px; font-size:18px; text-align:center; letter-spacing:6px;
  border:1px solid var(--line); border-radius:10px; margin:14px 0;}
.err{color:var(--red); font-size:13px; min-height:18px;}
.empty{padding:26px; text-align:center; color:var(--muted); font-size:14px;}
.modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; z-index:20;
  align-items:flex-end; justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff; width:100%; max-width:720px; max-height:88vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:16px 16px 30px;}
.modal h3{margin:4px 0 6px;}
.x{float:right; border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer;}
table.rep{width:100%; border-collapse:collapse; font-size:13px; background:#fff; border-radius:12px; overflow:hidden;}
table.rep th{background:var(--teal-d); color:#fff; padding:8px 6px; text-align:left; font-size:11px; text-transform:uppercase;}
table.rep td{padding:8px 6px; border-bottom:1px solid var(--line);}
table.rep tr.tot td{font-weight:700; background:#eef6f5;}
</style>
</head>

<script>
/* ============ CONFIG — se llena al desplegar ============ */
var CFG = {
  url: "https://script.google.com/macros/s/AKfycbzIMGe7XgC9NXF75o55cr1EXqLxu4QMrvDQeDhQfwwmE80wTYhPQys6ZAxoitkF5_vpGg/exec",
  token: "tRcJDmUuwfXVLAl47rWbYfRf2mBKBZtULszOC4PD4pEfXWl6"
};
</script>
<script>
/* ================= API ================= */
var SUC = 'CP1604';
async function api(action, params, isPost) {
  params = params || {};
  if (!isPost) {
    var q = new URLSearchParams(Object.assign({ action: action, token: CFG.token }, params));
    var r = await fetch(CFG.url + '?' + q.toString(), { cache: 'no-store' });
    return r.json();
  }
  var r2 = await fetch(CFG.url, { method: 'POST', cache: 'no-store',
    body: JSON.stringify(Object.assign({ action: action, token: CFG.token }, params)) });
  return r2.json();
}
function money(n){ n = parseFloat(n)||0; return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ================= LOGIN ================= */
var ME = null;
async function sha256hex(s){
  var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function doLogin(){
  var u = document.getElementById('pinUser').value.trim().toLowerCase();
  var p = document.getElementById('pinCode').value.trim();
  var err = document.getElementById('loginErr');
  err.textContent = 'Checking…';
  try {
    var d = await api('list', { tab: 'usuarios' });
    if (!d.ok) throw new Error(d.error || 'Connection error');
    var h = await sha256hex(p);
    var found = (d.rows||[]).find(function(r){
      return String(r.username||'').toLowerCase()===u && String(r.pinHash)===h && String(r.activo).toLowerCase()!=='no';
    });
    if (!found) { err.textContent = 'Incorrect username or PIN'; return; }
    ME = found;
    document.getElementById('loginView').style.display='none';
    document.getElementById('appView').style.display='block';
    document.getElementById('hdrSub').textContent = 'CP1604 · ' + (ME.nombre||ME.username);
    go('dash');
  } catch(e){ err.textContent = 'Error: ' + e.message; }
}

/* ================= MENU LATERAL ================= */
var MODS = [
  ['dash','<svg class="dr-ic"><use href="#i-chart"/></svg>','Dashboard','Daily summary'],
  ['ventas','<svg class="dr-ic"><use href="#i-cash"/></svg>','Sales','Day, week, month & quarter'],
  ['pl','<svg class="dr-ic"><use href="#i-trend"/></svg>','P&L','Profit, loss & break-even'],
  ['gastos','<svg class="dr-ic"><use href="#i-receipt"/></svg>','Expenses','Expense log'],
  ['personal','<svg class="dr-ic"><use href="#i-users"/></svg>','Staff','Staff, training & evaluations'],
  ['nomina','<svg class="dr-ic"><use href="#i-wallet"/></svg>','Payroll','Payments & tip-out'],
  ['inventario','<svg class="dr-ic"><use href="#i-box"/></svg>','Inventory','Stock & purchase orders'],
  ['menu','<svg class="dr-ic"><use href="#i-utensils"/></svg>','Menu','Dishes & recipes'],
  ['prov','<svg class="dr-ic"><use href="#i-truck"/></svg>','Vendors','Vendor catalog'],
  ['act','<svg class="dr-ic"><use href="#i-cal"/></svg>','Activities','2026 calendar'],
  ['bitacora','<svg class="dr-ic"><use href="#i-note"/></svg>','Logbook','Manager shift log'],
  ['checks','<svg class="dr-ic"><use href="#i-checksq"/></svg>','Checks','Checklists FOH / BOH']
];
function toggleDrawer(open){
  document.getElementById('drawer').classList.toggle('open', !!open);
  document.getElementById('drawerBg').classList.toggle('open', !!open);
  if (open) paintDrawer();
}
function paintDrawer(){
  document.getElementById('drawerItems').innerHTML = MODS.map(function(m){
    return '<div class="di'+(CUR===m[0]?' on':'')+'" onclick="toggleDrawer(false);go(\''+m[0]+'\')">'
      +'<div class="ic">'+m[1]+'</div><div><div class="t">'+m[2]+'</div><div class="s">'+m[3]+'</div></div></div>';
  }).join('');
}

/* ================= NAV ================= */
var CUR = 'dash';
function go(v){
  CUR = v;
  document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('active'); });
  document.getElementById('v-'+v).classList.add('active');
  document.querySelectorAll('#bottomNav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
  document.getElementById('fabBtn').style.display = (v==='dash'||v==='pl') ? 'none' : 'block';
  RENDER[v]();
}
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('modalBg').classList.add('open'); }
function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

/* ================= RECETA VIEW ================= */
async function viewReceta(id){
  var rows = await getRows('menu');
  var r = rows.find(function(x){ return String(x.id)===String(id); }) || {};
  var body = esc(r.receta||'')
    .replace(/Versión (\d+):/g, '<div class="rv-ver">Versión $1</div>')
    .replace(/(Garnish|Glass|Rim):/g, '<b>$1:</b>')
    .replace(/\n/g, '<br>');
  openModal('<h3><svg class="ic"><use href="#i-wine"/></svg> '+esc(r.platillo||'Recipe')+'</h3>' +
    '<div class="receta-view">'+body+'</div>' +
    '<button class="btn sec" style="margin-top:12px" onclick="closeModal()">Close</button>');
}
document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target===this) closeModal(); });

/* ================= DASHBOARD ================= */
function dStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function vTotal(r){ return (parseFloat(r.total)||0) || ((parseFloat(r.comedor)||0)+(parseFloat(r.paraLlevar)||0)+(parseFloat(r.delivery)||0)) || ((parseFloat(r.ventaComida)||0)+(parseFloat(r.ventaLicor)||0)); }
function sum(a){ return a.reduce(function(x,y){ return x+(parseFloat(y)||0); },0); }
function pct(n){ return (parseFloat(n)||0).toFixed(1)+'%'; }
async function rDash(){
  var el = document.getElementById('v-dash');
  el.innerHTML = '<div class="empty">Loading…</div>';
  try {
    var res = await Promise.all([
      api('dashboard', {}),
      api('list', { tab: 'ventas' }),
      api('list', { tab: 'gastos' }),
      api('list', { tab: 'nomina' })
    ]);
    var b = res[0].dashboard, ventas = res[1].rows||[], gastos = res[2].rows||[], nom = res[3].rows||[];
    var now = new Date(), hoy = dStr(now);
    var ayer = dStr(new Date(now.getTime()-864e5));
    var mon = mondayOf(hoy);
    var monD = new Date(mon+'T12:00:00');
    var sun = dStr(new Date(monD.getTime()+6*864e5));
    var META = 54000;
    function enSem(f){ return f>=mon && f<=sun; }
    /* ---- Ventas de la semana ---- */
    var vSem=0, vComida=0, vLicor=0, invSem=0, vHoy=0, vAyer=0;
    var dias = [];
    for (var i=0;i<7;i++){ var dt = new Date(monD.getTime()+i*864e5); dias.push({ f: dStr(dt), dw: 'M T W T F S S'[i*2]||'', v: 0 }); }
    ventas.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10), t = vTotal(r);
      if (f===hoy) vHoy += t;
      if (f===ayer) vAyer += t;
      if (enSem(f)){
        vSem += t; vComida += parseFloat(r.ventaComida)||0; vLicor += parseFloat(r.ventaLicor)||0; invSem += parseFloat(r.invitados)||0;
        for (var i=0;i<7;i++) if (dias[i].f===f) dias[i].v += t;
      }
    });
    var ppa = invSem>0 ? vSem/invSem : 0;
    var avance = META>0 ? vSem/META*100 : 0;
    var falta = Math.max(0, META - vSem);
    var diasRest = Math.max(1, Math.round((new Date(sun+'T12:00:00') - new Date(hoy+'T12:00:00'))/864e5) + 1);
    var porDia = falta>0 ? falta/diasRest : 0;
    var maxV = Math.max.apply(null, dias.map(function(x){return x.v;}).concat([1]));
    var bars = dias.map(function(x){
      var h = Math.max(4, Math.round(x.v/maxV*64));
      var fut = x.f>hoy;
      return '<div style="flex:1;text-align:center"><div style="height:70px;display:flex;align-items:flex-end;justify-content:center"><div style="width:70%;height:'+h+'px;background:'+(x.f===hoy?'var(--teal)':(fut?'#e8e8e8':'#bcd9d8'))+';border-radius:4px 4px 0 0"></div></div><div style="font-size:10px;color:var(--muted)">'+x.dw+'<br>'+x.f.substring(5).replace('-','/')+'</div></div>';
    }).join('');
    /* ---- Gastos de la semana ---- */
    var gCat = {}, gTot = 0;
    gastos.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10);
      if (enSem(f)){ var c=r.categoria||'Otros', m=parseFloat(r.monto)||0; gCat[c]=(gCat[c]||0)+m; gTot+=m; }
    });
    var gList = Object.keys(gCat).sort(function(a,b2){return gCat[b2]-gCat[a];});
    var gHtml = gList.map(function(c){
      var ps = vSem>0 ? (gCat[c]/vSem*100) : 0;
      var pt = gTot>0 ? Math.round(gCat[c]/gTot*100) : 0;
      return '<div class="row-item"><div><div class="t">'+esc(c)+'</div><div style="height:6px;background:#eee;border-radius:3px;margin-top:4px;width:140px"><div style="height:6px;width:'+pt+'%;background:var(--teal);border-radius:3px"></div></div></div><div style="text-align:right"><div class="amt">'+money(gCat[c])+'</div><div class="s">'+ps.toFixed(1)+'% de ventas</div></div></div>';
    }).join('') || '<div class="empty">Sin gastos esta semana</div>';
    var costoComida = vComida>0 ? (gCat['Food Merchandise']||0)/vComida*100 : null;
    var costoLicor = vLicor>0 ? (gCat['Liquor Merchandise']||0)/vLicor*100 : null;
    /* ---- Labor (payroll loaded in the app) ---- */
    var nomSem = nom.filter(function(r){ var f=String(r.periodoInicio||'').substring(0,10); return enSem(f); });
    var labor = nomSem.length ? nomSem.reduce(function(a,r){return a+(parseFloat(r.neto)||0);},0) : null;
    var laborPct = (labor!=null && vSem>0) ? labor/vSem*100 : null;
    /* ---- Resultado al momento ---- */
    var resultado = vSem - gTot - (labor||0);
    var margen = vSem>0 ? resultado/vSem*100 : 0;
    /* ---- Por pagar (invoices marcados por pagar) ---- */
    var porPagar = [];
    gastos.forEach(function(r){
      var mp = String(r.metodoPago||'').trim();
      var txt = ((r.notas||'')+' '+(r.descripcion||'')).toLowerCase();
      if (!mp && (txt.indexOf('por pagar')>=0 || txt.indexOf('invoice')>=0)){
        var m = String(r.notas||'').match(/(\d{4}-\d{2}-\d{2})/);
        porPagar.push({ prov: r.proveedor||r.descripcion||'Invoice', desc: r.descripcion||'', monto: parseFloat(r.monto)||0, vence: m?m[1]:'' });
      }
    });
    porPagar.sort(function(a,b2){ return (a.vence||'9999') < (b2.vence||'9999') ? -1 : 1; });
    var ppTot = porPagar.reduce(function(a,r){return a+r.monto;},0);
    var ppHtml = porPagar.map(function(r){
      var venc = r.vence ? ('Due '+r.vence.substring(5).replace('-','/')+'/'+r.vence.substring(0,4)) : 'No due date';
      var tarde = r.vence && r.vence<hoy;
      return '<div class="row-item"><div><div class="t">'+esc(r.prov)+'</div><div class="s">'+esc(r.desc)+' · '+venc+'</div></div><span class="amt"'+(tarde?' style="color:var(--red)"':'')+'>'+money(r.monto)+'</span></div>';
    }).join('') || '<div class="empty">Nothing pending</div>';
    /* ---- Inventario bajo / horas ---- */
    var inv = (b.inventarioBajo||[]).map(function(r){
      return '<div class="row-item"><div><div class="t">'+esc(r.producto)+'</div><div class="s">Par: '+esc(r.minimo)+'</div></div><span class="badge bad">'+esc(r.existencia)+'</span></div>';
    }).join('') || '<div class="empty">All at normal levels</div>';
    var hrs = {};
    nomSem.forEach(function(r){ var id=r.personalId||'?'; hrs[id]=(hrs[id]||0)+(parseFloat(r.horas)||0); });
    var hAlert = Object.keys(hrs).filter(function(id){ return hrs[id]>=35; })
      .sort(function(a,b2){return hrs[b2]-hrs[a];})
      .map(function(id){
        var h = Math.round(hrs[id]*10)/10;
        return '<div class="row-item"><div><div class="t">'+esc(id)+'</div><div class="s">'+(h>=40?'Over 40h':'Watch the hours')+' · watch labor cost</div></div><span class="badge '+(h>=40?'bad':'warn')+'">'+h+'h</span></div>';
      }).join('');
    /* ---- Plan de la semana (forecast) ---- */
    var KPI = { comida: 28, licor: 21, labor: 28 };
    var wdSum = [0,0,0,0,0,0,0], wdCnt = [0,0,0,0,0,0,0], histTot = 0, histCom = 0, histLic = 0;
    ventas.forEach(function(r){
      var f = String(r.fecha||'').substring(0,10); if (!f) return;
      var wd = (new Date(f+'T12:00:00').getDay()+6)%7;
      var t = vTotal(r); wdSum[wd]+=t; wdCnt[wd]++; histTot+=t; histCom+=parseFloat(r.ventaComida)||0; histLic+=parseFloat(r.ventaLicor)||0;
    });
    var wdAvg = wdSum.map(function(s,i){ return wdCnt[i]? s/wdCnt[i] : 0; });
    var semProm = wdAvg.reduce(function(a,b2){return a+b2;},0);
    var pesos = wdAvg.map(function(a){ return semProm>0? a/semProm : 1/7; });
    var shareCom = histTot>0? histCom/histTot : 0, shareLic = histTot>0? histLic/histTot : 0;
    var diasSem = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    var pesoRest = 0; dias.forEach(function(x,i){ if (x.f>=hoy) pesoRest += pesos[i]; });
    var planHtml = dias.map(function(x,i){
      var metaD = META*pesos[i], pronD = semProm*pesos[i];
      var necD = (x.f>=hoy && falta>0 && pesoRest>0) ? falta*(pesos[i]/pesoRest) : 0;
      var real = x.f<hoy ? money(x.v) : (x.f===hoy ? money(x.v)+' (today)' : '—');
      var s = 'Goal '+money(metaD)+' · Forecast '+money(pronD)+(necD>0?' · Needed '+money(necD):'');
      return '<div class="row-item"><div><div class="t">'+diasSem[i]+' '+x.f.substring(5).replace('-','/')+'</div><div class="s">'+s+'</div></div><div class="amt">'+real+'</div></div>';
    }).join('');
    function presRow(nombre, gastado, permitido, totalSem){
      if (gastado==null) return '<div class="row-item"><div><div class="t">'+nombre+'</div><div class="s">No data loaded this week · full-week budget '+money(totalSem)+'</div></div><span class="badge warn">no data</span></div>';
      var diff = gastado - permitido;
      var ok = diff<=0;
      return '<div class="row-item"><div><div class="t">'+nombre+'</div><div class="s">Spent '+money(gastado)+' · allowed to date '+money(permitido)+' · full week '+money(totalSem)+'</div></div><span class="badge '+(ok?'':'bad')+'">'+(ok?'on track':'over by '+money(diff))+'</span></div>';
    }
    var presHtml =
      presRow('Food · 28%', gCat['Food Merchandise']||0, KPI.comida/100*vComida, KPI.comida/100*semProm*shareCom) +
      presRow('Liquor · 21%', gCat['Liquor Merchandise']||0, KPI.licor/100*vLicor, KPI.licor/100*semProm*shareLic) +
      presRow('Labor · 28%', labor, KPI.labor/100*vSem, KPI.labor/100*semProm);
    /* ---- Alerts ---- */
    var alerts = [];
    var lastDay = null;
    ventas.forEach(function(r){ var f=String(r.fecha||'').substring(0,10); if (f && f<hoy && vTotal(r)>0) { if(!lastDay || f>lastDay.f) lastDay = {f:f, r:r}; } });
    if (lastDay) {
      var vv = parseFloat(lastDay.r.voids)||0, vt = vTotal(lastDay.r);
      if (vv>250 && vt>0) alerts.push({sev:'bad', t:'High voids · '+lastDay.f, s:'Voids '+money(vv)+' ('+(vv/vt*100).toFixed(1)+'% of sales) on the last closed day'});
      var dc = parseFloat(lastDay.r.descuentos)||0;
      if (dc>0 && vt>0 && dc/vt>0.04) alerts.push({sev:'warn', t:'High discounts · '+lastDay.f, s:'Discounts & comps '+money(dc)+' ('+(dc/vt*100).toFixed(1)+'% of sales)'});
      var wdI = (new Date(lastDay.f+'T12:00:00').getDay()+6)%7;
      var expD = semProm*pesos[wdI];
      if (expD>0 && vt < expD*0.7) alerts.push({sev:'warn', t:'Sales below pace · '+lastDay.f, s:'Sold '+money(vt)+' vs forecast '+money(expD)+' for that weekday'});
    }
    porPagar.forEach(function(r){ if (r.vence) { var dl = Math.round((new Date(r.vence+'T12:00:00') - new Date(hoy+'T12:00:00'))/86400000); if (dl<=3) alerts.push({sev: dl<0?'bad':'warn', t:(dl<0?'Overdue invoice':'Invoice due soon')+' · '+r.prov, s: money(r.monto)+' · due '+r.vence}); } });
    if (vComida>0 && (gCat['Food Merchandise']||0) > KPI.comida/100*vComida) alerts.push({sev:'bad', t:'Food budget over', s:'Food purchases exceed 28% of food sales to date'});
    if (vLicor>0 && (gCat['Liquor Merchandise']||0) > KPI.licor/100*vLicor) alerts.push({sev:'bad', t:'Liquor budget over', s:'Liquor purchases exceed 21% of liquor sales to date'});
    var alertsHtml = alerts.length ? alerts.map(function(al){ return '<div class="row-item"><div><div class="t">'+al.t+'</div><div class="s">'+al.s+'</div></div><span class="badge '+(al.sev==='bad'?'bad':'warn')+'">'+(al.sev==='bad'?'action':'watch')+'</span></div>'; }).join('') : '<div class="row-item"><div><div class="t">All clear</div><div class="s">No alerts right now</div></div><span class="badge">ok</span></div>';
    el.innerHTML =
      '<h2 class="st">Alerts</h2><div class="list" style="margin-bottom:14px">'+alertsHtml+'</div>' +
      '<h2 class="st">Week · '+mon.substring(5).replace('-','/')+' to '+sun.substring(5).replace('-','/')+'</h2>' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">Sales this week</div><div class="val money">'+money(vSem)+'</div>' +
          '<div style="height:6px;background:#eee;border-radius:3px;margin:6px 0 4px"><div style="height:6px;width:'+Math.min(100,Math.round(avance))+'%;background:var(--teal);border-radius:3px"></div></div>' +
          '<div style="font-size:12px;color:var(--muted)">'+avance.toFixed(1)+'% of goal '+money(META)+' · '+invSem+' guests · PPA '+money(ppa)+'</div>' +
          '<div style="font-size:12px;color:var(--muted)">Today '+money(vHoy)+' · Yesterday '+money(vAyer)+'</div></div>' +
        '<div class="card"><div class="lbl">Result so far</div><div class="val '+(resultado<0?'neg':'money')+'">'+money(resultado)+'</div>' +
          '<div style="font-size:12px;color:var(--muted)">Margin '+margen.toFixed(1)+'% · Sales − expenses'+(labor!=null?' − labor':'')+'</div>' +
          '<div style="font-size:12px;color:var(--muted)">'+(labor!=null ? ('Labor '+money(labor)+(laborPct!=null?' ('+laborPct.toFixed(1)+'% de ventas)':'')) : 'No labor yet: this week\'s payroll has not been loaded to the app')+'</div></div>' +
      '</div>' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">Pace to goal</div><div class="val">'+(falta>0?money(falta):'✓')+'</div><div style="font-size:12px;color:var(--muted)">'+(falta>0 ? ('To go · sell '+money(porDia)+' per day over '+diasRest+' day(s)') : 'Weekly goal reached')+'</div></div>' +
        '<div class="card"><div class="lbl">Accounts payable</div><div class="val '+(ppTot>0?'neg':'money')+'">'+money(ppTot)+'</div><div style="font-size:12px;color:var(--muted)">'+porPagar.length+' invoice(s) pending</div></div>' +
      '</div>' +
      '<div class="cards">' +
        '<div class="card"><div class="lbl">Food cost</div><div class="val '+((costoComida!=null&&costoComida>28)?'neg':'')+'">'+(costoComida!=null?costoComida.toFixed(1)+'%':'—')+'</div><div style="font-size:12px;color:var(--muted)">Goal 28% · Food purchases '+money(gCat['Food Merchandise']||0)+' ÷ food sales '+money(vComida)+'</div></div>' +
        '<div class="card"><div class="lbl">Liquor cost</div><div class="val '+((costoLicor!=null&&costoLicor>21)?'neg':'')+'">'+(costoLicor!=null?costoLicor.toFixed(1)+'%':'—')+'</div><div style="font-size:12px;color:var(--muted)">Goal 21% · Liquor purchases '+money(gCat['Liquor Merchandise']||0)+' ÷ liquor sales '+money(vLicor)+'</div></div>' +
      '</div>' +
      '<h2 class="st">Daily sales · week</h2><div class="card" style="margin-bottom:14px"><div style="display:flex;gap:4px">'+bars+'</div></div>' +
      '<h2 class="st">Weekly plan · forecast '+money(semProm)+'</h2><div class="list" style="margin-bottom:14px">'+planHtml+'</div>' +
      '<h2 class="st">Spending budget to date</h2><div class="list" style="margin-bottom:14px">'+presHtml+'</div>' +
      '<h2 class="st">Expenses this week · '+money(gTot)+'</h2><div class="list" style="margin-bottom:14px">'+gHtml+'</div>' +
      '<h2 class="st">Accounts payable · '+money(ppTot)+'</h2><div class="list" style="margin-bottom:14px">'+ppHtml+'</div>' +
      (hAlert ? '<h2 class="st"><svg class="ic"><use href="#i-alert"/></svg> Hours this week · watch labor cost</h2><div class="list" style="margin-bottom:14px">'+hAlert+'</div>' : '') +
      '<h2 class="st"><svg class="ic"><use href="#i-alert"/></svg> Low inventory</h2><div class="list">'+inv+'</div>' +
      '<p style="color:#888;font-size:12px;margin-top:10px">Week runs Monday to Sunday. Result = net sales − recorded expenses − labor loaded in the app. "Accounts payable" = expenses flagged as unpaid invoices in the Expenses tab.</p>';
  } catch(e){ el.innerHTML = '<div class="empty">Error: '+esc(e.message)+'</div>'; }
}
</script>
<script>
/* ================= TAB DEFINITIONS ================= */

      {k:'sueldoBase',l:'Base pay $',t:'number'},

      {k:'notas',l:'Notes',t:'text'}

      {k:'puesto',l:'Position',t:'select',opts:PUESTOS,req:1},
      {k:'titulo',l:'Title',t:'text',req:1},
      {k:'duracion',l:'Duration',t:'text'},
      {k:'descripcion',l:'Description',t:'text'},
      {k:'documento',l:'Document (URL)',t:'text'}
    ],
    row:function(r){ return {t:esc(r.titulo||''), s:esc(r.puesto||'')+' · '+esc(r.duracion||''), badge:''}; } },
  training_progreso: { tab:'training_progreso', title:'Training progress', singular:'record',
    fields:[
      {k:'personalId',l:'Employee (ID)',t:'text',req:1},
      {k:'trainingId',l:'Program (ID)',t:'text',req:1},
      {k:'fechaInicio',l:'Start date',t:'date',req:1},
      {k:'fechaFin',l:'End date',t:'date'},
      {k:'estado',l:'Status',t:'select',opts:['In progress','Certified','Conditional certification','Not certified']},
      {k:'entrenador',l:'Trainer',t:'text'},
      {k:'evaluacion',l:'Evaluation (1-5)',t:'number'},

var CACHE = {};
async function getRows(tab){
  if (CACHE[tab]) return CACHE[tab];
  var d = await api('list', { tab: tab });
  if (!d.ok) throw new Error(d.error);
  var rows = (d.rows||[]).filter(function(r){ return String(r.sucursal||SUC)===SUC || !r.sucursal; });
  rows.sort(function(a,b){ return String(b._row)-String(a._row); });
  CACHE[tab] = rows;
  return rows;
}

/* ============ ORDEN DE COMPRA (por pares) ============ */
async function openOrder(){
  var el = document.getElementById('v-inventario');
  el.innerHTML = '<div class="empty">Calculating…</div>';
  var rows = await getRows('inventario');
  var need = [];
  rows.forEach(function(r){
    var ex = parseFloat(r.existencia)||0, par = parseFloat(r.minimo)||0, mx = parseFloat(r.maximo)||0;
    if (r.minimo!=='' && ex <= par) {
      var sug = Math.max(0, Math.round(((mx>0?mx:par) - ex)*100)/100);
      need.push({ r: r, sug: sug });
    }
  });
  if (!need.length) {
    el.innerHTML = '<h2 class="st"><svg class="ic"><use href="#i-clip"/></svg> Purchase order</h2><div class="empty">Everything is above par. Nothing to order. <svg class="ic"><use href="#i-checksq"/></svg></div><button class="btn sec" onclick="renderList(\'inventario\')">← Back to inventory</button>';
    return;
  }
  var groups = {};
  need.forEach(function(n){ var c = n.r.categoria||'No category'; (groups[c]=groups[c]||[]).push(n); });
  var html = '<h2 class="st"><svg class="ic"><use href="#i-clip"/></svg> Purchase order · '+need.length+' products</h2>';
  Object.keys(groups).sort().forEach(function(c){
    html += '<h2 class="st" style="margin-top:12px">'+esc(c)+'</h2><div class="list">';
    groups[c].forEach(function(n){
      var r = n.r;
      html += '<div class="row-item"><div><div class="t">'+esc(r.producto)+'</div><div class="s">On hand '+esc(r.existencia||'0')+' '+esc(r.unidad||'')+' · Par '+esc(r.minimo)+'</div></div><div style="text-align:right"><span class="badge bad">Order '+n.sug+' '+esc(r.unidad||'')+'</span></div></div>';
    });
    html += '</div>';
  });
  html += '<p style="font-size:12px;color:var(--muted)">Suggested = fill up to the max (or to par if there is no max). When Toast sales are pulled in, the suggestion will also factor in what sells.</p>';
  html += '<button class="btn sec" onclick="renderList(\'inventario\')">← Back to inventory</button>';
  el.innerHTML = html;
}

/* Metas del formato OP-ADMIN COSTA 1604: semana $54,000 (lun 4,000, mar 4,000, mié 5,000, jue 8,000, vie 13,000, sáb 13,500, dom 6,500) */
var META_DIA = [6500,4000,4000,5000,8000,13000,13500];
function metaDia(f){ var d=new Date(f+'T12:00:00'); return isNaN(d)?0:(META_DIA[d.getDay()]||0); }
function metaRango(a,b){ var t=0, d=new Date(a+'T12:00:00'), e=new Date(b+'T12:00:00'); while(d<=e){ t+=metaDia(dStr(d)); d.setDate(d.getDate()+1); } return t; }
function hasVal(r,k){ var v=r[k]; return v!==''&&v!==null&&v!==undefined; }
function sumK(rows,k){ var t=0,n=0; rows.forEach(function(r){ if(hasVal(r,k)){ t+=parseFloat(r[k])||0; n++; } }); return {t:t,n:n}; }
function gcat(g,c){ var t=0,n=0; g.forEach(function(r){ if((r.categoria||'')===c){ t+=parseFloat(r.monto)||0; n++; } }); return {t:t,n:n}; }
function aggRango(v,g,a,b){
  var vv=v.filter(function(r){ var f=String(r.fecha||'').substring(0,10); return f>=a&&f<=b; });
  var gg=g.filter(function(r){ var f=String(r.fecha||'').substring(0,10); return f>=a&&f<=b; });
  var ag={n:vv.length};
  var net=0; vv.forEach(function(r){ net+=vTotal(r); }); ag.net={t:net,n:vv.length};
  ag.vC=sumK(vv,'ventaComida'); ag.vL=sumK(vv,'ventaLicor');
  ag.inv=sumK(vv,'invitados');
  ag.prop=sumK(vv,'propinas'); ag.imp=sumK(vv,'impuestos'); ag.grat=sumK(vv,'gratificacion');
  ag.desc=sumK(vv,'descuentos'); ag.voids=sumK(vv,'voids');
  ag.efec=sumK(vv,'efectivo'); ag.tarj=sumK(vv,'tarjeta');
  ag.des=sumK(vv,'desayuno'); ag.com=sumK(vv,'comida'); ag.cen=sumK(vv,'cena'); ag.noc=sumK(vv,'noche');
  ag.gMC=gcat(gg,'Food Merchandise'); ag.gML=gcat(gg,'Liquor Merchandise');
  var foh=gcat(gg,'Disposables'), limp=gcat(gg,'Cleaning');
  ag.gFOH={t:foh.t+limp.t,n:foh.n+limp.n};
  ag.gRenta=gcat(gg,'Rent');
  var ot={t:0,n:0}; ['Services','Equipment','Marketing','Music & Entertainment','Repairs','Other'].forEach(function(c){ var s=gcat(gg,c); ot.t+=s.t; ot.n+=s.n; });
  ag.gOtros=ot;
  var gt={t:0,n:0}; gg.forEach(function(r){ if((r.categoria||'')!=='Payroll'){ gt.t+=parseFloat(r.monto)||0; gt.n++; } });
  ag.gTot=gt;
  ag.notas=vv.map(function(r){ return r.notas; }).filter(function(x){ return x; }).join(' · ');
  return ag;
}
function laborRango(n,a,b){ var t=0,c=0; n.forEach(function(r){ var f=String(r.periodoFin||'').substring(0,10); if(f>=a&&f<=b){ t+=parseFloat(r.neto)||0; c++; } }); return c>0?t:null; }
function deriv(ag,labor){
  var d={};
  d.totalAmt=(ag.net.n||ag.grat.n||ag.imp.n||ag.prop.n)?ag.net.t+ag.grat.t+ag.imp.t+ag.prop.t:null;
  d.cobrado=(ag.efec.n||ag.tarj.n)?ag.efec.t+ag.tarj.t:null;
  d.ppa=ag.inv.t>0?ag.net.t/ag.inv.t:null;
  d.mealTot=(ag.des.n||ag.com.n||ag.cen.n||ag.noc.n)?ag.des.t+ag.com.t+ag.cen.t+ag.noc.t:null;
  d.cogs=(ag.gMC.n||ag.gML.n)?ag.gMC.t+ag.gML.t:null;
  d.foodPct=(ag.gMC.n&&ag.vC.t>0)?ag.gMC.t/ag.vC.t*100:null;
  d.liqPct=(ag.gML.n&&ag.vL.t>0)?ag.gML.t/ag.vL.t*100:null;
  d.labPct=(labor!==null&&ag.net.t>0)?labor/ag.net.t*100:null;
  d.prime=(d.cogs!==null&&labor!==null&&ag.net.t>0)?(d.cogs+labor)/ag.net.t*100:null;
  d.util=(ag.net.n||ag.gTot.n)?ag.net.t-ag.gTot.t-(labor||0):null;
  return d;

function formatoTable(cols){
  cols.forEach(function(c){ c.dv=deriv(c.ag, c.labor); });
  var rows=formatoRows();
  var h='<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:560px"><tr><th style="text-align:left;padding:6px">Concept</th>'+cols.map(function(c){ return '<th style="padding:6px;text-align:right">'+c.h+'</th>'; }).join('')+'</tr>';
  rows.forEach(function(r){
    if(r.sec){ h+='<tr><td colspan="'+(cols.length+1)+'" style="padding:8px 6px 3px;font-weight:700;background:#f4f2ee">'+r.sec+'</td></tr>'; return; }
    h+='<tr style="border-top:1px solid #eee"><td style="padding:6px'+(r.m?';font-weight:700':'')+'">'+r.l+'</td>';
    cols.forEach(function(c){
      var v=r.f(c.ag, c.dv, c.labor, c.meta);
      h+= r.p?pcell(v, r.m):(r.n?ncell(v, r.m):mcell(v, r.m));
    });
    h+='</tr>';
  });
  return h+'</table></div>';
}

var PL_VISTA = 'semana';
function setPLVista(v){ PL_VISTA = v; renderPL(); }
async function renderPL(){
  var el = document.getElementById('v-pl');
  el.innerHTML = '<h2 class="st">P&L · Profit & break-even</h2><div class="empty">Loading…</div>';
  try {
    var v = await getRows('ventas'), g = await getRows('gastos'), n = await getRows('nomina'), fx = await getRows('costosfijos');
    var hoy = todayStr();
    var a, b, lbl;
    if (PL_VISTA==='semana'){ a = mondayOf(hoy); var d1 = new Date(a+'T12:00:00'); d1.setDate(d1.getDate()+6); b = dStr(d1); lbl = 'This week'; }
    else if (PL_VISTA==='mes'){ a = hoy.substring(0,7)+'-01'; var d2 = new Date(a+'T12:00:00'); d2.setMonth(d2.getMonth()+1); d2.setDate(0); b = dStr(d2); lbl = 'This month'; }
    else { var d0 = new Date(hoy.substring(0,7)+'-01T12:00:00'); d0.setDate(0); b = dStr(d0); a = b.substring(0,7)+'-01'; lbl = 'Last month'; }
    var ag = aggRango(v, g, a, b);
    var labor = laborRango(n, a, b);
    var ventasT = ag.net.t || 0;
    var cogs = (ag.gMC.t||0) + (ag.gML.t||0);
    var otros = Math.max(0, (ag.gTot.t||0) - cogs);
    var dias = Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000) + 1;
    var fijoMes = 0;
    fx.forEach(function(r){ if (String(r.activo).toLowerCase()!=='no') fijoMes += parseFloat(r.montoMensual)||0; });
    var fijos = fijoMes * 12 / 52 / 7 * dias;
    var costosVar = cogs + (labor||0) + otros;
    var resultado = ventasT - costosVar - fijos;
    var cm = ventasT > 0 ? (ventasT - costosVar)/ventasT : 0;
    var be = (cm > 0 && fijoMes > 0) ? fijos/cm : null;
    var dif = be != null ? ventasT - be : null;
    function prow(l, val, sub, bold){
      return '<div class="row-item"><div><div class="t"'+(bold?' style="font-weight:800"':'')+'>'+l+'</div>'+(sub?'<div class="s">'+sub+'</div>':'')+'</div><div class="amt">'+val+'</div></div>';
    }
    var pctT = function(x){ return ventasT>0 ? (x/ventasT*100).toFixed(1)+'% of sales' : ''; };
    var h = '<div style="display:flex;gap:8px;margin-bottom:10px">' +
      [['semana','Week'],['mes','Month'],['pasado','Last month']].map(function(x){ return '<button class="btn '+(PL_VISTA===x[0]?'':'sec')+'" style="margin:0;padding:9px" onclick="setPLVista(\''+x[0]+'\')">'+x[1]+'</button>'; }).join('') + '</div>';
    h += '<div class="cards">' +
      '<div class="card"><div class="lbl">Break-even · '+lbl+'</div><div class="val">'+(be!=null?money(be):'—')+'</div><div style="font-size:12px;color:var(--muted)">'+(dif!=null ? ('You are '+money(Math.abs(dif))+(dif>=0?' above':' BELOW')+' break-even') : 'Load the fixed costs below to calculate it')+'</div></div>' +
      '<div class="card"><div class="lbl">Operating result</div><div class="val '+(resultado<0?'neg':'money')+'">'+money(resultado)+'</div><div style="font-size:12px;color:var(--muted)">'+a+' to '+b+'</div></div></div>';
    h += '<div class="list" style="margin-bottom:14px">' +
      prow('Net sales', money(ventasT), '', true) +
      prow('Food purchases', money(ag.gMC.t||0), pctT(ag.gMC.t||0)+(ag.vC.t>0?' · '+(ag.gMC.t/ag.vC.t*100).toFixed(1)+'% of food sales':'')) +
      prow('Liquor purchases', money(ag.gML.t||0), pctT(ag.gML.t||0)+(ag.vL.t>0?' · '+(ag.gML.t/ag.vL.t*100).toFixed(1)+'% of liquor sales':'')) +
      prow('Labor', labor!=null?money(labor):'Not loaded', labor!=null?pctT(labor):'Payroll for this period is not in the app yet') +
      prow('Other operating expenses', money(otros), pctT(otros)) +
      prow('Fixed costs (prorated)', money(fijos), money(fijoMes)+'/month loaded') +
      prow('Operating result', money(resultado), '', true) +
    '</div>';
    h += '<button class="btn sec" style="margin:0" onclick="go(\'costosfijos\')">Manage fixed costs</button>';
    h += '<p style="color:#888;font-size:12px;margin-top:10px">Break-even = fixed costs ÷ contribution margin (sales − purchases − labor − other operating expenses). Purchase-based food cost only becomes real once every food invoice is loaded.</p>';
    el.innerHTML = '<h2 class="st">P&L · Profit & break-even</h2>' + h;
  } catch(e){ el.innerHTML = '<h2 class="st">P&L</h2><div class="empty">Error: '+esc(e.message)+'</div>'; }
}
RENDER['pl'] = renderPL;

/* ================= FORM ================= */
function fldHtml(f, val){
  val = val==null?'':val;
  var req = f.req ? 'required' : '';
  if (f.t==='select') {
    return '<label>'+f.l+'</label><select id="f_'+f.k+'" '+req+'><option value="">—</option>' +
      f.opts.map(function(o){ return '<option value="'+esc(o)+'"'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; }).join('') + '</select>';
  }
  if (f.t==='foto') {
    var link = val ? '<div style="margin:2px 0 6px"><a href="'+esc(val)+'" target="_blank" rel="noopener">View current file</a></div>' : '';
    return '<label>'+f.l+'</label>' + link +
      '<input id="f_'+f.k+'" type="hidden" value="'+esc(val)+'">' +
      '<input id="foto_'+f.k+'" type="file" accept="image/*,.pdf,application/pdf" onchange="fotoPreview(this,\'prev_'+f.k+'\',\'nom_'+f.k+'\')">' +
      '<img id="prev_'+f.k+'" alt="" style="display:none;max-width:160px;max-height:160px;border-radius:8px;margin-top:6px">' +
      '<div id="nom_'+f.k+'" style="display:none;margin-top:6px;font-size:13px"></div>';
  }
  if (f.t==='textarea' || f.k==='notas') return '<label>'+f.l+'</label><textarea id="f_'+f.k+'">'+esc(val)+'</textarea>';
  var type = f.t==='number' ? 'number' : (f.t==='date' ? 'date' : 'text');
  var step = f.t==='number' ? 'step="0.01"' : '';
  return '<label>'+f.l+'</label><input id="f_'+f.k+'" type="'+type+'" '+step+' value="'+esc(val)+'" '+req+'>';
}
function fotoPreview(input, imgId, nomId){
  var img = document.getElementById(imgId);
  var nom = document.getElementById(nomId);
  if (!img) return;
  if (input.files && input.files[0]) {
    var file = input.files[0];
    var esPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    if (esPdf) {
      img.removeAttribute('src');
      img.style.display = 'none';
      if (nom) { nom.textContent = 'PDF: ' + file.name; nom.style.display = 'block'; }
    } else {
      img.src = URL.createObjectURL(file);
      img.style.display = 'block';
      if (nom) { nom.textContent = ''; nom.style.display = 'none'; }
    }
  } else {
    img.removeAttribute('src');
    img.style.display = 'none';
    if (nom) { nom.textContent = ''; nom.style.display = 'none'; }
  }
}
function leerFotoBase64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.onload = function(){ resolve(String(r.result || '')); };
    r.onerror = function(){ reject(new Error('Could not read the photo')); };
    r.readAsDataURL(file);
  });
}
async function openForm(key, id, fechaPreset){
  key = key || CUR; if (key==='dash'||key==='pl') return;
  var def = TABDEF[key];
  var rec = {};
  if (id) {
    var rows = await getRows(def.tab);
    rec = rows.find(function(r){ return String(r.id)===String(id); }) || {};
  } else {
    if (def.fields.some(function(f){return f.k==='fecha';})) rec.fecha = fechaPreset || todayStr();
    if (def.fields.some(function(f){return f.k==='activo';})) rec.activo = 'Yes';
    if (def.fields.some(function(f){return f.k==='pagado';})) rec.pagado = 'No';
    if (def.fields.some(function(f){return f.k==='tipo';})) rec.tipo = (MENU_FILT==='Food'||MENU_FILT==='Bar') ? MENU_FILT : 'Food';
  }
  var html = '<h3>'+(id?'Edit':'New')+' '+def.singular+'</h3><form class="sheet" onsubmit="return saveForm(event,\''+key+'\',\''+esc(id||'')+'\')">' +
    def.fields.map(function(f){ return fldHtml(f, rec[f.k]); }).join('') +
    '<button class="btn" type="submit">Save</button>' +
    (id ? '<button class="btn danger" type="button" onclick="delRec(\''+key+'\',\''+esc(id)+'\')">Delete</button>' : '') +
    '</form>';
  openModal(html);
}
async function saveForm(ev, key, id){
  ev.preventDefault();
  var def = TABDEF[key];
  var rec = { sucursal: SUC };
  var fotoFallo = false, guardado = false;
  def.fields.forEach(function(f){
    var el = document.getElementById('f_'+f.k);
    rec[f.k] = el ? el.value.trim() : '';
  });
  if (key==='ventas' && !rec.total) {
    var ch=(parseFloat(rec.comedor)||0)+(parseFloat(rec.paraLlevar)||0)+(parseFloat(rec.delivery)||0);
    var fl=(parseFloat(rec.ventaComida)||0)+(parseFloat(rec.ventaLicor)||0);
    var mp=(parseFloat(rec.desayuno)||0)+(parseFloat(rec.comida)||0)+(parseFloat(rec.cena)||0)+(parseFloat(rec.noche)||0);
    rec.total = ch>0?ch:(fl>0?fl:mp);
  }
  if (key==='nomina') {
    var vb = parseFloat(rec.ventasBrutas)||0, pd = parseFloat(rec.propinasDeclaradas)||0;
    if (vb>0 && pd>0) rec.propinas = Math.round((pd - vb*0.04)*100)/100;
  }
  if (key==='evaluaciones') {
    var sc = ['actitud','conocimiento','ejecucion','equipo','comunicacion'].map(function(k){ return parseFloat(rec[k])||0; }).filter(function(x){ return x>0; });
    if (sc.length) rec.promedio = Math.round(sc.reduce(function(a,b){return a+b;},0)/sc.length*10)/10;
  }
  if (key==='gastos') {
    /* Foto del ticket: se sube ANTES de guardar; el link de Drive queda en recibo.
       Si la subida falla, el gasto se guarda sin foto y se avisa al final. */
    var fotoEl = document.getElementById('foto_recibo');
    if (fotoEl && fotoEl.files && fotoEl.files[0]) {
      try {
        if (fotoEl.files[0].size > 15*1024*1024) throw new Error('The file is larger than 15 MB');
        var dataUrl = await leerFotoBase64(fotoEl.files[0]);
        var tipoArchivo = fotoEl.files[0].type || (/\.pdf$/i.test(fotoEl.files[0].name) ? 'application/pdf' : 'image/jpeg');
        var up = await api('uploadTicket', { data:dataUrl, mimeType: tipoArchivo, fecha: rec.fecha, proveedor: rec.proveedor }, true);
        if (!up.ok || !up.url) throw new Error(up.error || 'The server did not return a link');
        rec.recibo = up.url;
      } catch(e){ fotoFallo = true; }
    }
  }
  /* Fechas como texto: el backend convierte las fechas a Date y la zona horaria del script las regresa un día antes (v1.21: 5-nov se leía 4-nov). El apóstrofe las guarda como texto "YYYY-MM-DD" y se leen igual. */
  def.fields.forEach(function(f){
    if (f.t==='date' && /^\d{4}-\d{2}-\d{2}$/.test(rec[f.k]||'')) rec[f.k] = "'" + rec[f.k];
  });
  try {
    var d = id ? await api('update', { tab:def.tab, id:id, fields:rec }, true)
               : await api('create', { tab:def.tab, record:rec }, true);
    if (!d.ok) throw new Error(d.error);
    guardado = true;
    delete CACHE[def.tab];
    closeModal();
    if (['personal','training','training_progreso','evaluaciones','puestos'].indexOf(key)>=0) renderPersonal(); else if (key==='checklists') renderChecks(); else if (key==='ventas') renderVentas(); else renderList(key);
  } catch(e){ alert('Error: '+e.message); }
  if (guardado && fotoFallo) alert('The expense was saved, but the ticket file was NOT uploaded. Edit the expense and try attaching it again.');
  return false;
}
async function delRec(key, id){
  if (!confirm('Delete this record?')) return;
  var def = TABDEF[key];
  try {
    var d = await api('delete', { tab:def.tab, id:id }, true);
    if (!d.ok) throw new Error(d.error);
    delete CACHE[def.tab];
    closeModal();
    if (['personal','training','training_progreso','evaluaciones','puestos'].indexOf(key)>=0) renderPersonal(); else if (key==='checklists') renderChecks(); else if (key==='ventas') renderVentas(); else renderList(key);
  } catch(e){ alert('Error: '+e.message); }
}
